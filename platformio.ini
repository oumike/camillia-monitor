[platformio]
default_envs = heltec-v4

[env:heltec-v4]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_qspi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

build_flags =
    -DDEVICE_HELTEC_V4_EXPANSION=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/hal
    -Isrc/mesh
    -Isrc/config
    -Isrc/net
    -Isrc/sensors
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_src_flags = -Wno-cpp

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit BMP280 Library@^3.0.0
    adafruit/Adafruit Unified Sensor@^1.1.15
    https://github.com/Quency-D/chsc6x/archive/3b2b6cebf3177b3e2c33d06e07909b0b10159516.zip
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

build_src_filter =
    +<main.cpp>
    +<mesh/mesh_proto.cpp>
    +<mesh/mesh_radio.cpp>
    +<mesh/mesh_channel_plan.cpp>
    +<config/monitor_config.cpp>
    +<net/web_config.cpp>
    +<net/node_uplink.cpp>
    +<net/time_sync.cpp>
    +<net/mqtt_monitor.cpp>
    +<sensors/gps.cpp>
    +<sensors/env_sensor.cpp>
    +<sensors/battery.cpp>
    +<mesh/mesh_enum_names.cpp>